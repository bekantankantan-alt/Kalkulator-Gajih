name: Build APK from Single ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p /tmp/kalkulator-project
          unzip -q "$ZIP_FILE" -d /tmp/kalkulator-project

          SETTINGS_FILE="$(find /tmp/kalkulator-project -type f -name settings.gradle | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan di dalam ZIP!"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          cp -a "$PROJECT_ROOT/app" ./app
          cp "$PROJECT_ROOT/settings.gradle" ./settings.gradle
          cp "$PROJECT_ROOT/build.gradle" ./build.gradle
          cp "$PROJECT_ROOT/gradle.properties" ./gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Gajih-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
